[project]
name = "gridwatch-backend"
version = "0.1.0"
description = "GridWatch Electricity Theft Detection & Smart Metering Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-dotenv>=1.0.1",
    "scikit-learn==1.5.2",
    "numpy==2.1.3",
    "reportlab>=4.2.5",
    "paho-mqtt>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
